<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>students marks </title>
</head>
<body>
    <h1>student scoring more than 60</h1>
    {% for student in students %}
        {% if student ["marks"] > 60 %}
            <p>Name:{{ student["name"]}}</p>
            <p>Marks:{{student["marks"]}}</p>
            <hr>
        {% endif %}
    {% endfor %}
</body>
</html>
